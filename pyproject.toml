[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs57"
version = "0.1.0"
description = "Keeper salaries, prize tracking, and league history for the RS57 fantasy football league"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    # The site generator only. Autoescaping is on and stays on; markupsafe comes with it and
    # is what render_markdown escapes with.
    "jinja2>=3.1",
]

[project.optional-dependencies]
# The local admin tool only. Deliberately NOT a base dependency: the nightly Action installs
# this package to run the syncs and the site generator, and neither has any business pulling
# in a web framework.
admin = [
    "flask>=3.0",
]
dev = [
    "pytest>=8.0",
    "flask>=3.0",
]

[tool.setuptools.packages.find]
include = ["rs57*"]

[tool.setuptools.package-data]
rs57 = ["templates/*.html", "admin/templates/*.html", "admin/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
