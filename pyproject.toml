[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs57"
version = "0.1.0"
description = "Keeper salaries, prize tracking, and league history for the RS57 fantasy football league"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["rs57*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
