name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # Phase 2 adds `python -m rs57.validate` here — cross-file reference checks, no
      # orphans, no duplicate keeper slots, fee sums correct.
